services:
  web:
    build: ./frontend
    container_name: fplgeek-web
    restart: always
    expose:
      - "80"
    volumes:
      - ./data:/usr/share/nginx/html/data
    environment:
      - VIRTUAL_HOST=fplgeek.xyz,www.fplgeek.xyz
      - LETSENCRYPT_HOST=fplgeek.xyz,www.fplgeek.xyz
      - LETSENCRYPT_EMAIL=your@email.com
    depends_on:
      - server
    networks:
      - proxy

  server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fplgeek-server
    restart: always
    env_file: .env
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      - FPL_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    networks:
      - proxy

networks:
  proxy:
    external: true