version: 1

services:
  # Backend Service
  - type: web
    name: fplgeek-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ServerPort
        value: 3000
      - key: DATA_DIR
        value: /opt/render/project/src/backend/data
    # Note: Disk removed because it is not supported on Render's free tier. 
    # Data will not persist across restarts.

  # Frontend Service
  - type: web
    name: fplgeek-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /ai-api/*
        destination: https://fplgeek-backend.onrender.com/*
      - type: rewrite
        source: /data/*
        destination: https://fplgeek-backend.onrender.com/data/*
      - type: rewrite
        source: /api/*
        destination: https://fantasy.premierleague.com/*
      - type: rewrite
        source: /[^.]*
        destination: /index.html
        source: /data/*
        destination: https://fplgeek-backend.onrender.com/data/*
      - type: rewrite
        source: /api/*
        destination: https://fantasy.premierleague.com/*
      - type: rewrite
        source: /^(?!.*\\..*).*/
        destination: /index.html
