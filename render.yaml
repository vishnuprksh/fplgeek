version: 1

services:
  # Backend Service
  - type: web
    name: fplgeek-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    healthCheckInterval: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: ServerPort
        value: 3000
      - key: DATA_DIR
        value: /opt/render/project/src/backend/data
      - key: DATABASE_URL
        fromDatabase:
          name: fplgeek-postgres
          property: connectionString
    # Note: Database persistence via Postgres instead of local disk
    # Render free tier provides free PostgreSQL instance

  # Frontend Service
  - type: web
    name: fplgeek-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /ai-api/*
        destination: https://fplgeek-backend.onrender.com/*
      - type: rewrite
        source: /[^.]*
        destination: /index.html
      - type: rewrite
        source: /^(?!.*\\..*).*/
        destination: /index.html

# PostgreSQL Database for data persistence
databases:
  - name: fplgeek-postgres
    plan: free
    region: oregon
