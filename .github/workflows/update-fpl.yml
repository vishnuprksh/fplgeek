name: Weekly FPL Data Update

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install Python dependencies
        run: |
          cd backend/scripts
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: |
          cd backend
          npm install

      - name: Run data ingestion pipeline
        run: |
          cd backend
          echo "🔄 Ingesting historical gameweek data..."
          python scripts/ingest_historical_gw.py
          
          echo "🔄 Preprocessing dataset..."
          npx tsx scripts/preprocessing_dataset.ts
          
          echo "🔄 Training model and generating predictions..."
          python scripts/model_manager_unified.py

      - name: Load data files
        id: load_data
        run: |
          cd backend
          echo "predictions=$(cat data/ai_predictions.json | jq -c '.')" >> $GITHUB_OUTPUT
          echo "fixtures=$(cat data/fixtures.json | jq -c '.')" >> $GITHUB_OUTPUT
          echo "league_analysis=$(cat data/league_analysis.json | jq -c '.')" >> $GITHUB_OUTPUT
          echo "feature_importance=$(cat data/feature_importance.json | jq -c '.')" >> $GITHUB_OUTPUT

      - name: Ingest data to Render backend
        run: |
          echo "📡 Pushing data to Render backend..."
          
          # Construct JSON payload
          PAYLOAD=$(cat <<EOF
          {
            "predictions": $(cat backend/data/ai_predictions.json),
            "fixtures": $(cat backend/data/fixtures.json),
            "league_analysis": $(cat backend/data/league_analysis.json),
            "feature_importance": $(cat backend/data/feature_importance.json)
          }
          EOF
          )
          
          # Send to backend (adjust URL if needed)
          RESPONSE=$(curl -s -X POST https://fplgeek-backend.onrender.com/api/ingest-data \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          echo "Response: $RESPONSE"
          
          # Check if successful
          if echo "$RESPONSE" | jq -e '.success' > /dev/null 2>&1; then
            echo "✅ Data successfully ingested to Render backend"
          else
            echo "⚠️  Unexpected response from backend"
            exit 1
          fi

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Weekly FPL data update completed successfully!"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Weekly FPL data update failed!"
          echo "Check logs above for details"
          exit 1
